name: Destroy · Teardown Dev Environment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Escribe "DESTROY" para confirmar la destrucción completa del entorno dev'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'

jobs:
  destroy:
    name: Teardown Dev Environment
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DESTROY" ]; then
            echo "ERROR: Confirmación inválida. Debe ser exactamente 'DESTROY'. Operación cancelada por seguridad."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init (envs/dev)
        run: terraform -chdir=envs/dev init

      - name: Terraform Destroy (envs/dev)
        run: terraform -chdir=envs/dev destroy -auto-approve
