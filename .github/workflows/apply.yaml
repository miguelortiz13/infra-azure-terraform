name: Apply · Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'modules/**'
      - 'envs/dev/**'
      - '.github/workflows/apply.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Generate Deployment Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init (envs/dev)
        run: terraform -chdir=envs/dev init

      - name: Terraform Plan (envs/dev)
        id: plan
        run: |
          terraform -chdir=envs/dev plan -no-color -out=tfplan > plan.txt
          cat plan.txt

      - name: Upload Execution Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-tfplan
          path: |
            envs/dev/tfplan
            plan.txt
          retention-days: 1

  apply:
    name: Apply to Dev Environment
    runs-on: ubuntu-latest
    needs: plan
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download Execution Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: dev-tfplan
          path: envs/dev

      - name: Terraform Init (envs/dev)
        run: terraform -chdir=envs/dev init

      - name: Terraform Apply (envs/dev)
        run: terraform -chdir=envs/dev apply -auto-approve tfplan
